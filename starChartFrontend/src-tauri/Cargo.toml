[package]
name = "starchartfrontend"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starchartfrontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `native-tls` uses the operating system's TLS (Security framework on macOS,
# SChannel on Windows), so `wss://` connections are encrypted and certificates
# are checked against the system's trusted roots
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures-util = { workspace = true }
reqwest = { workspace = true }
star_chart_protocol = { workspace = true }

# Shared dependency versions and the release profile live in the workspace
# Cargo.toml at the repo root
