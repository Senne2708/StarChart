[package]
name = "star_chart_server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { workspace = true }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "migrate", "uuid"] }
star_chart_protocol = { workspace = true, features = ["sqlx"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v7", "serde"] }

# Only used by the tests, to talk to a running server like a real client
[dev-dependencies]
futures-util = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
